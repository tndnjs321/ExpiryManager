<!doctype html>
<html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>유통기한 관리 · 로그인 테스트</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f3f6fa;color:#172c44;font:16px/1.6 system-ui,sans-serif}main{max-width:480px;margin:0 auto;padding:32px 16px}section{background:white;border:1px solid #dae2ec;border-radius:16px;padding:24px;margin:16px 0}h1{font-size:26px;margin:0 0 8px}label{display:block;font-weight:600;margin:16px 0}input,button{font:inherit;border:1px solid #b6c4d3;border-radius:9px;padding:12px;width:100%;min-height:48px}input{display:block;margin-top:6px}button{background:#176456;color:white;cursor:pointer}button:disabled{opacity:.6}p{overflow-wrap:anywhere}.muted{color:#596b7e}[hidden]{display:none!important}</style>
<main><p class="muted">BAKERY · 개발 환경</p><h1>유통기한 관리</h1><section id="login" hidden><form id="loginForm"><label>이메일<input id="email" type="email" autocomplete="username" required></label><label>비밀번호<input id="password" type="password" autocomplete="current-password" required></label><button id="submit" type="submit">로그인</button></form></section><section id="account" hidden><h2>로그인 및 매장 접근 확인</h2><p id="identity"></p><p id="stores"></p><p class="muted">개발용 인증 테스트입니다. 상품 DB 연동 전까지 기존 상품 데이터는 변경하지 않습니다.</p><button id="logout">로그아웃</button></section><p id="status" role="status" aria-live="polite">연결 확인 중…</p></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
'use strict';
const el=id=>document.getElementById(id);
const msg=t=>el('status').textContent=t;
if(!window.supabase){msg('인증 라이브러리를 불러오지 못했습니다. 새로고침하세요.');}
else {
 const client=window.supabase.createClient('https://lfkxwylieimqmusjnxpx.supabase.co','sb_publishable_nhXpBa4cbLBx2fg_ufOOPg_kkDVtO38',{auth:{storageKey:'expiry-manager-dev-auth',detectSessionInUrl:false}});
 let revision=0;
 function lock(){el('account').hidden=true;el('identity').textContent='';el('stores').textContent='';}
 async function inspect(session,seq){
  if(seq!==revision)return;
  lock();
  el('login').hidden=!!session;
  if(!session){msg('이메일과 비밀번호를 입력하세요.');return;}
  el('account').hidden=false;el('identity').textContent=session.user.email||'로그인 사용자';msg('매장 접근 권한 확인 중…');
  try{
   const {data,error}=await client.schema('bakery_dev').from('store_members').select('role, stores(id,name)').eq('user_id',session.user.id);
   if(seq!==revision)return;
   if(error)throw error;
   const allowed=(data||[]).filter(row=>row.stores&&['owner','admin','member'].includes(row.role));
   if(!allowed.length){msg('등록된 매장이 없습니다. 관리자에게 문의하세요.');return;}
   el('stores').textContent=allowed.map(row=>row.stores.name+' · '+row.role).join(' / ');
   msg('로그인 및 매장 조회 성공');
  }catch(error){if(seq===revision)msg('매장 조회 실패: '+(error.message||'연결 오류'));}
 }
 client.auth.onAuthStateChange((_event,session)=>{const seq=++revision;lock();setTimeout(()=>inspect(session,seq),0);});
 el('loginForm').onsubmit=async e=>{
  e.preventDefault();el('submit').disabled=true;msg('로그인 중…');
  try{const {error}=await client.auth.signInWithPassword({email:el('email').value.trim(),password:el('password').value});if(error)msg('로그인 실패: '+error.message);}
  catch(error){msg('로그인 연결 오류: '+error.message);}
  finally{el('password').value='';el('submit').disabled=false;}
 };
 el('logout').onclick=async()=>{el('logout').disabled=true;try{const {error}=await client.auth.signOut({scope:'local'});if(error)throw error;}catch(error){msg('로그아웃 실패: '+error.message);}finally{el('logout').disabled=false;}};
}
</script></html>
