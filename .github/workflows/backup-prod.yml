name: Production daily backup and history cleanup

run-name: ${{ inputs.monitor_preview && 'Monitor preview' || inputs.automatic_run && 'Cloudflare automatic' || 'Manual' }} - backup-prod

on:
  workflow_dispatch:
    inputs:
      monitor_preview:
        description: 'Read-only monitor test (skip backup, cleanup, and FCM; include R2)'
        required: false
        type: boolean
        default: false
      automatic_run:
        description: 'Set by the Cloudflare scheduler only'
        required: false
        type: boolean
        default: false
      healthcheck_test:
        description: 'Send monitoring signal for this manual test'
        required: true
        type: boolean
        default: false
      commit_cleanup:
        description: 'Delete eligible processed items after verified backup (manual runs only)'
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: bakery-production-backup
  cancel-in-progress: false

jobs:
  backup:
    if: github.ref == 'refs/heads/main' && inputs.monitor_preview != true
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout production source
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate backup script
        run: bash -n scripts/backup-prod.sh
      - name: Backup to R2, verify object, then clean eligible history
        id: backup
        env:
          PGHOST: ${{ secrets.DB_HOST }}
          PGUSER: ${{ secrets.PROD_DB_USER }}
          PGPASSWORD: ${{ secrets.PROD_DB_PASSWORD }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          CLEANUP_MODE: ${{ (github.event_name == 'schedule' || inputs.commit_cleanup == true) && 'commit' || 'rollback' }}
        run: bash scripts/backup-prod.sh
      - name: Authenticate to Google Cloud without service account key
        id: auth
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: projects/387988934070/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: notification-sender@personal-notifications-ed12b.iam.gserviceaccount.com
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/firebase.messaging
          access_token_lifetime: 600s
          create_credentials_file: false
          export_environment_variables: false
      - name: Send owner backup result
        if: ${{ !cancelled() && steps.auth.outcome == 'success' }}
        env:
          PGHOST: ${{ secrets.DB_HOST }}
          PGUSER: ${{ secrets.PROD_NOTIFY_DB_USER }}
          PGPASSWORD: ${{ secrets.PROD_NOTIFY_DB_PASSWORD }}
          FCM_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          PGPORT: '5432'
          PGDATABASE: postgres
          PGSSLMODE: verify-full
          PGCONNECT_TIMEOUT: '20'
          AUTOMATIC_RUN: ${{ inputs.automatic_run }}
          BACKUP_OUTCOME: ${{ steps.backup.outcome }}
          BACKUP_VERIFIED: ${{ steps.backup.outputs.backup_verified }}
          SNAPSHOT_STORE: ${{ steps.backup.outputs.snapshot_store }}
          PRODUCTS_COUNT: ${{ steps.backup.outputs.products_count }}
          ITEMS_COUNT: ${{ steps.backup.outputs.items_count }}
          CLEANUP_MODE: ${{ steps.backup.outputs.cleanup_mode }}
          CLEANUP_COUNT: ${{ steps.backup.outputs.cleanup_count }}
        run: |
          set -euo pipefail
          export PGSSLROOTCERT="$GITHUB_WORKSPACE/scripts/certs/prod-ca-2021.crt"
          python3 -m py_compile scripts/notify-system-prod.py
          python3 scripts/notify-system-prod.py backup
      - name: Report outcome to Healthchecks
        if: ${{ !cancelled() && (github.event_name == 'schedule' || inputs.automatic_run == true || inputs.healthcheck_test == true) }}
        env:
          HC_URL: ${{ secrets.HC_BACKUP_URL }}
          WORKFLOW_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          if [[ ! "$HC_URL" =~ ^https://hc-ping\.com/[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}/?$ ]]; then
            echo "Missing or invalid Healthchecks ping URL"
            exit 1
          fi
          endpoint="${HC_URL%/}"
          if [[ "$WORKFLOW_STATUS" != "success" ]]; then
            endpoint="$endpoint/fail"
          fi
          if ! curl --proto '=https' --fail --silent --max-time 10 --retry 2 --retry-delay 2 --retry-max-time 25 --output /dev/null "$endpoint"; then
            echo "Healthchecks signal delivery failed"
            exit 1
          fi
          echo "Healthchecks signal accepted: $WORKFLOW_STATUS"

  owner-monitor:
    needs: backup
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && (inputs.monitor_preview == true || inputs.automatic_run == true || github.event_name == 'schedule') }}
    # An automatic monitor failure must not change the backup outcome or Healthchecks ping.
    # Preview failures remain visible as failed workflow runs.
    continue-on-error: ${{ inputs.monitor_preview != true }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout production source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate monitor script
        run: python3 -m py_compile scripts/owner-monitor-prod.py
      - name: Read-only monitor preview
        if: ${{ inputs.monitor_preview == true }}
        env:
          OWNER_MONITOR_JOB_KEY: ${{ secrets.OWNER_MONITOR_JOB_KEY }}
        run: python3 scripts/owner-monitor-prod.py preview
      - name: Collect daily and weekly usage and reserve new alerts
        id: monitor
        if: ${{ inputs.monitor_preview != true }}
        env:
          OWNER_MONITOR_JOB_KEY: ${{ secrets.OWNER_MONITOR_JOB_KEY }}
        run: python3 scripts/owner-monitor-prod.py check
      - name: Authenticate to Firebase only when alerts are reserved
        id: monitor-auth
        if: ${{ inputs.monitor_preview != true && steps.monitor.outputs.alert_count != '0' && steps.monitor.outcome == 'success' }}
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: projects/387988934070/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: notification-sender@personal-notifications-ed12b.iam.gserviceaccount.com
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/firebase.messaging
          access_token_lifetime: 600s
          create_credentials_file: false
          export_environment_variables: false
      - name: Send reserved warnings to owner devices and record results
        if: ${{ !cancelled() && inputs.monitor_preview != true && steps.monitor.outcome == 'success' && steps.monitor.outputs.alert_count != '0' }}
        env:
          OWNER_MONITOR_JOB_KEY: ${{ secrets.OWNER_MONITOR_JOB_KEY }}
          PGHOST: ${{ secrets.DB_HOST }}
          PGUSER: ${{ secrets.PROD_NOTIFY_DB_USER }}
          PGPASSWORD: ${{ secrets.PROD_NOTIFY_DB_PASSWORD }}
          FCM_ACCESS_TOKEN: ${{ steps.monitor-auth.outputs.access_token }}
          PGPORT: '5432'
          PGDATABASE: postgres
          PGSSLMODE: verify-full
          PGCONNECT_TIMEOUT: '20'
        run: |
          set -euo pipefail
          export PGSSLROOTCERT="$GITHUB_WORKSPACE/scripts/certs/prod-ca-2021.crt"
          python3 scripts/owner-monitor-prod.py send
      - name: Surface incomplete metric collection
        if: ${{ !cancelled() && inputs.monitor_preview != true && steps.monitor.outcome == 'success' && steps.monitor.outputs.failed_count != '0' }}
        run: |
          echo "::error::One or more monitor queries failed; inspect the monitoring job."
          exit 1
