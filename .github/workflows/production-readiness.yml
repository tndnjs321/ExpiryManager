name: Production readiness checks

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/production-readiness.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bakery-production-readiness
  cancel-in-progress: false

jobs:
  backup-preview:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate backup script
        run: bash -n scripts/backup-prod.sh
      - name: Verify production backup and rollback cleanup
        env:
          PGHOST: ${{ secrets.DB_HOST }}
          PGUSER: ${{ secrets.PROD_DB_USER }}
          PGPASSWORD: ${{ secrets.PROD_DB_PASSWORD }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          CLEANUP_MODE: rollback
        run: bash scripts/backup-prod.sh

  notification-preview:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate notification script
        run: python3 -m py_compile scripts/notify-prod.py
      - name: Preview notification history cleanup
        env:
          PGHOST: ${{ secrets.DB_HOST }}
          PGUSER: ${{ secrets.PROD_NOTIFY_DB_USER }}
          PGPASSWORD: ${{ secrets.PROD_NOTIFY_DB_PASSWORD }}
          PGPORT: '5432'
          PGDATABASE: postgres
          PGSSLMODE: verify-full
          PGCONNECT_TIMEOUT: '20'
        run: |
          set -euo pipefail
          export PGSSLROOTCERT="$GITHUB_WORKSPACE/scripts/certs/prod-ca-2021.crt"
          python3 scripts/notify-prod.py --cleanup-preview
