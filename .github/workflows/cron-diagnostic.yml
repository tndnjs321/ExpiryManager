name: Temporary cron diagnostic

on:
  workflow_dispatch:
  schedule:
    - cron: '3,13,23,33,43,53 * * * *'

permissions: {}

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Show trigger and UTC time
        env:
          EVENT: ${{ github.event_name }}
          CRON: ${{ github.event.schedule }}
        run: |
          printf 'Event: %s\nCron: %s\n' "$EVENT" "$CRON"
          date -u
