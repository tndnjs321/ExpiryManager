name: Development R2 backup test

on:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/backup-dev-test.yml'
      - 'scripts/backup-dev.sh'

permissions:
  contents: read

concurrency:
  group: bakery-dev-backup-test
  cancel-in-progress: false

jobs:
  backup:
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout development source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify tools and shell syntax
        run: |
          command -v psql
          command -v aws
          command -v python3
          bash -n scripts/backup-dev.sh
      - name: Backup and verify R2 object
        env:
          PGHOST: ${{ secrets.DB_HOST }}
          PGUSER: ${{ secrets.DB_USER }}
          PGPASSWORD: ${{ secrets.DB_PASSWORD }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: bash scripts/backup-dev.sh
