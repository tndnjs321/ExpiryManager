name: Production notification history cleanup

on:
  schedule:
    - cron: '30 18 * * *'
  workflow_dispatch:
    inputs:
      healthcheck_test:
        description: 'Send monitoring signal for this manual test'
        required: true
        type: boolean
        default: false
      commit_cleanup:
        description: 'Delete notification history and inactive devices older than 90 days and login attempts older than 7 days (manual runs only)'
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: bakery-production-notify-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout production source
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate notification script
        run: python3 -m py_compile scripts/notify-prod.py
      - name: Apply notification and login retention policies
        env:
          PGHOST: ${{ secrets.DB_HOST }}
          PGUSER: ${{ secrets.PROD_NOTIFY_DB_USER }}
          PGPASSWORD: ${{ secrets.PROD_NOTIFY_DB_PASSWORD }}
          PGPORT: '5432'
          PGDATABASE: postgres
          PGSSLMODE: verify-full
          PGCONNECT_TIMEOUT: '20'
          CLEANUP_ARGUMENT: ${{ (github.event_name == 'schedule' || inputs.commit_cleanup == true) && '--cleanup-commit' || '--cleanup-preview' }}
        run: |
          set -euo pipefail
          export PGSSLROOTCERT="$GITHUB_WORKSPACE/scripts/certs/prod-ca-2021.crt"
          python3 scripts/notify-prod.py "$CLEANUP_ARGUMENT"
      - name: Authenticate to Google Cloud without service account key
        id: auth
        if: ${{ failure() && steps.checkout.outcome == 'success' }}
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: projects/387988934070/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: notification-sender@personal-notifications-ed12b.iam.gserviceaccount.com
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/firebase.messaging
          access_token_lifetime: 600s
          create_credentials_file: false
          export_environment_variables: false
      - name: Report retention cleanup failure to owner
        if: ${{ failure() && steps.auth.outcome == 'success' }}
        env:
          PGHOST: ${{ secrets.DB_HOST }}
          PGUSER: ${{ secrets.PROD_NOTIFY_DB_USER }}
          PGPASSWORD: ${{ secrets.PROD_NOTIFY_DB_PASSWORD }}
          FCM_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          PGPORT: '5432'
          PGDATABASE: postgres
          PGSSLMODE: verify-full
          PGCONNECT_TIMEOUT: '20'
        run: |
          set -euo pipefail
          export PGSSLROOTCERT="$GITHUB_WORKSPACE/scripts/certs/prod-ca-2021.crt"
          python3 -m py_compile scripts/notify-system-prod.py
          python3 scripts/notify-system-prod.py cleanup-failure
      - name: Report outcome to Healthchecks
        if: ${{ !cancelled() && (github.event_name == 'schedule' || inputs.healthcheck_test == true) }}
        env:
          HC_URL: ${{ secrets.HC_CLEANUP_URL }}
          WORKFLOW_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          if [[ ! "$HC_URL" =~ ^https://hc-ping\.com/[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}/?$ ]]; then
            echo "Missing or invalid Healthchecks ping URL"
            exit 1
          fi
          endpoint="${HC_URL%/}"
          if [[ "$WORKFLOW_STATUS" != "success" ]]; then
            endpoint="$endpoint/fail"
          fi
          if ! curl --proto '=https' --fail --silent --max-time 10 --retry 2 --retry-delay 2 --retry-max-time 25 --output /dev/null "$endpoint"; then
            echo "Healthchecks signal delivery failed"
            exit 1
          fi
          echo "Healthchecks signal accepted: $WORKFLOW_STATUS"
